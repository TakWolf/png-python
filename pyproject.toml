[project]
name = "png"
version = "0.0.0"
description = "Pure Python Implementation of Portable Network Graphics (PNG) Specification and Extensions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TakWolf" },
]
maintainers = [
    { name = "TakWolf" },
]
keywords = ["png", "image"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.urls]
Homepage = "https://github.com/TakWolf/png-python"
Source = "https://github.com/TakWolf/png-python"
Issues = "https://github.com/TakWolf/png-python/issues"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
